<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Sistema de Logística</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon-brand.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-brand-icon" aria-hidden="true">
        <img src="{{ url_for('static', filename='img/icon-brand.svg') }}" alt="" width="26" height="26" class="hdr-icon">
      </div>
      <div class="auth-brand-text">
        <span class="auth-brand-name">Sistema de Logística</span>
        <span class="auth-brand-sub">Integradora Comercial del Golfo S.A. de C.V.</span>
      </div>
    </div>

    <h1 class="auth-titulo">Iniciar sesión</h1>
    <p class="auth-subtitulo">Ingresa tus credenciales para continuar</p>

    {% if error %}
    <div class="auth-error" role="alert">
      <i data-lucide="triangle-alert" style="width:15px;height:15px"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" class="auth-form" autocomplete="off">
      <label class="auth-label" for="username">Usuario</label>
      <div class="auth-input-wrap">
        <i data-lucide="user" class="auth-input-icon"></i>
        <input
          type="text"
          id="username"
          name="username"
          class="auth-input"
          placeholder="Tu nombre de usuario"
          value="{{ username or '' }}"
          autocomplete="username"
          autofocus
          required
        >
      </div>

      <label class="auth-label" for="password">Contraseña</label>
      <div class="auth-input-wrap">
        <i data-lucide="lock" class="auth-input-icon"></i>
        <input
          type="password"
          id="password"
          name="password"
          class="auth-input"
          placeholder="Tu contraseña"
          autocomplete="current-password"
          required
        >
        <button type="button" class="auth-toggle-pw" id="auth-toggle-pw" aria-label="Mostrar contraseña" tabindex="-1">
          <i data-lucide="eye" id="auth-toggle-pw-icon" style="width:15px;height:15px"></i>
        </button>
      </div>

      <button type="submit" class="auth-btn-submit">
        <i data-lucide="log-in" style="width:15px;height:15px"></i>
        Entrar
      </button>
    </form>

    <div class="auth-footer">
      Acceso restringido. Contacta al administrador si no cuentas con credenciales.
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  lucide.createIcons();
  (function () {
    const btn  = document.getElementById('auth-toggle-pw');
    const icon = document.getElementById('auth-toggle-pw-icon');
    const inp  = document.getElementById('password');
    if (!btn || !inp) return;
    btn.addEventListener('click', () => {
      const mostrar = inp.type === 'password';
      inp.type = mostrar ? 'text' : 'password';
      icon.setAttribute('data-lucide', mostrar ? 'eye-off' : 'eye');
      lucide.createIcons();
    });
  })();
</script>
</body>
</html>
